repos:
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.7.0
    hooks:
      - id: pyupgrade
        args: [
          "--py39-plus",
          "--keep-percent-format"
        ]

  - repo: local
    hooks:
      - id: black
        name: black
        entry: black
        language: system
        types: [python]
        args: []

      - id: no-sphinx-role-xrefs-in-python
        name: no Sphinx :role:`...` in Python
        entry: ':[a-z]+:`[^`]*`'
        language: pygrep
        types: [python]

  - repo: https://github.com/PyCQA/isort
    rev: 5.12.0
    hooks:
      - id: isort

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types: [python]
        args: [
          "--config",
          "pyproject.toml"
        ]
        # Suppress a flaky internal mypy error appearing randomly when executing make lint.
        require_serial: true

      # Fails when type annotation coverage of the esrally package drops below the threshold.
      - id: type-coverage
        name: type coverage
        entry: pyrefly
        language: system
        args: [
          "coverage",
          "check",
          "--output-format",
          "omit-errors",
          "--fail-under",
          "20"
        ]
        # pyrefly measures the whole project as configured in [tool.pyrefly]; passing the changed files
        # would only measure those.
        pass_filenames: false
        files: ^esrally/.*\.py$
        # Always show the coverage percentage, not only on failure.
        verbose: true

  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: pylint
        language: system
        types: [python]
        args:
          [
            "-rn",
            "-j0",
            "--rcfile=.pylintrc",
          ]
        exclude: ^docs/
        require_serial: true
