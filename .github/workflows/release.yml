name: Release to PyPI

on:
  push:
    branches:
      - "master"
    tags:
      - "*"

permissions:
  contents: read

jobs:
  build:
    name: Build dists
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0 # Needed by hatch-vcs to compute a unique version for each commit
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          version: "0.11.19"
          python-version: "3.13.7"
      - name: Build dists
        run: uv build
      - name: Upload dists
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: "dist"
          path: "dist/"
          if-no-files-found: error
          retention-days: 5

  pypi-publish:
    name: Upload release to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    needs: [build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write  # Needed for trusted publishing to PyPI

    steps:
      - name: Download dists
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: "dist"
          path: "dist/"
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  test-pypi-publish:
    name: "Upload release to Test PyPI"
    needs: ["build"]
    permissions:
      id-token: write # Needed for trusted publishing to Test PyPI.
    runs-on: "ubuntu-latest"
    environment:
      name: "testpypi"

    steps:
      - name: "Download dists"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: "dist"
          path: "dist/"
      - name: "Publish dists to Test PyPI"
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  offline-dist:
    name: Offline install package
    needs: [pypi-publish]
    permissions:
      contents: write  # Needed to create the draft release and upload assets
    uses: ./.github/workflows/offline-dist.yml
    with:
      version: ${{ github.ref_name }}
