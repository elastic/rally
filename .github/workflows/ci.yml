name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '0 14 * * *'
  # Allows triggering the job manually
  workflow_dispatch:

env:
  DEFAULT_BRANCH: master

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.19"
      - name: Run tests
        run: make lint
      - uses: elastic/es-perf-github-status@v2
        if: ${{ failure() && ( github.event_name == 'schedule' || ( github.event_name == 'push' && github.ref_name == env.DEFAULT_BRANCH ) ) }}
        with:
          slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
          slack_channel: ${{ secrets.SLACK_CHANNEL }}
          status: FAILED
          persist-credentials: false

  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
        os:
          - macos-latest
          - ubuntu-latest

    runs-on: ${{ matrix.os }}
    name: unit ${{ fromJson('{"macos-latest":"macOS","ubuntu-latest":"Ubuntu"}')[matrix.os] }} ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.19"
      - name: Run tests
        run: make test-${{matrix.python-version}}
      - uses: elastic/es-perf-github-status@v2
        if: ${{ failure() && ( github.event_name == 'schedule' || ( github.event_name == 'push' && github.ref_name == env.DEFAULT_BRANCH ) ) }}
        with:
          slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
          slack_channel: ${{ secrets.SLACK_CHANNEL }}
          status: FAILED
          persist-credentials: false

  rally-tracks-compat:
    runs-on: ubuntu-22.04

    steps:
      - name: Check public IP address
        run: curl -4s ifconfig.me
        continue-on-error: true
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - run: echo "JAVA21_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - run: echo "JAVA11_HOME=$JAVA_HOME_11_X64" >> "$GITHUB_ENV"
      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.19"
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/lib/android
          sudo apt-get clean
          df -h
      - name: Run tests
        run: make it_tracks_compat
        timeout-minutes: 160
        env:
          # elastic/endpoint fetches assets from GitHub, authenticate to avoid
          # being rate limited
          ASSETS_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check disk space after
        run: df -h
      - uses: elastic/es-perf-github-status@v2
        if: ${{ failure() && ( github.event_name == 'schedule' || ( github.event_name == 'push' && github.ref_name == env.DEFAULT_BRANCH ) ) }}
        with:
          slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
          slack_channel: ${{ secrets.SLACK_CHANNEL }}
          status: FAILED
          persist-credentials: false
      # Artifact will show up under "Artifacts" in the "Summary" page of runs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rally-tracks-compat-logs
          path: |
            /home/runner/.rally/logs/
            /home/runner/.rally/benchmarks/races/**/*.log
          if-no-files-found: error

  install-with-pyenv:
    runs-on: ubuntu-22.04

    steps:
      - name: Install Python with pyenv
        shell: bash
        run: |
          export PYENV_ROOT="$RUNNER_TEMP/pyenv"
          git clone --depth 1 --branch v2.8.14 \
            https://github.com/pyenv/pyenv.git "$PYENV_ROOT"

          "$PYENV_ROOT/bin/pyenv" install 3.13.7
          "$PYENV_ROOT/bin/pyenv" global 3.13.7

          echo "PYENV_ROOT=$PYENV_ROOT" >> "$GITHUB_ENV"
          {
            echo "$PYENV_ROOT/bin"
            echo "$PYENV_ROOT/shims"
            echo "$HOME/.local/bin"
          } >> "$GITHUB_PATH"

      - name: Check Python version
        run: python3 --version | grep "Python 3.13.7"
      - name: Install Rally
        run: python3 -m pip install --user esrally
      - run: esrally --version
      - uses: elastic/es-perf-github-status@v2
        if: ${{ failure() && ( github.event_name == 'schedule' || ( github.event_name == 'push' && github.ref_name == env.DEFAULT_BRANCH ) ) }}
        with:
          slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
          slack_channel: ${{ secrets.SLACK_CHANNEL }}
          status: FAILED
          persist-credentials: false
