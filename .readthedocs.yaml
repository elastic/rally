version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.13"
  jobs:
    post_checkout:
      # The changelog page links each fragment to the pull request that added it, which needs the full history.
      - git fetch --unshallow || true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - develop

sphinx:
  fail_on_warning: true
  configuration: docs/conf.py
